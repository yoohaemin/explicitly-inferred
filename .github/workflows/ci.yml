name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-jdks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25, 26]
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
    - run: chmod +x ./mill
    - run: ./mill --no-server 'plugin[3.9.0].test.testCached'

  publish-local:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - run: chmod +x ./mill
    - run: ./mill --no-server 'plugin[3.9.0].publishLocal'
